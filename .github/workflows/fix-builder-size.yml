name: Fix Builder Style

on:
  push:
    paths:
      - .github/workflows/fix-builder-size.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix invalid JSX style
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('myvor-v1/app/BuilderModule.tsx')
          s=p.read_text()
          old='fontSize:13px,lineHeight:1.5'
          new='fontSize:13,lineHeight:1.5'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myvor-v1/app/BuilderModule.tsx
          git commit -m "Fix Note Builder object typography"
          git push
