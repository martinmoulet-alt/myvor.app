name: Apply MDE temporal guard

'on':
  push:
    paths:
      - .github/workflows/fix-mde-temporal-language.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch temporal semantics
        run: python scripts/fix_temporal_guard.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myvor-v1/supabase/functions/urgency-score-analysis/index.ts myvor-v1/supabase/functions/decision-engine/index.ts
          if git diff --cached --quiet; then
            echo "Temporal guard already applied"
          else
            git commit -m "Enforce current-date semantics in MDE"
            git push
          fi
