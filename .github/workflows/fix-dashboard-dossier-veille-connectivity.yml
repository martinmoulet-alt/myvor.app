name: Fix dashboard dossier veille connectivity

on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-dossier-veille-connectivity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: myvor-v1/package-lock.json
      - name: Repair cross-module connectivity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dossiers_path = Path('myvor-v1/app/DossiersCorporate.tsx')
          text = dossiers_path.read_text()
          anchor = '  useEffect(()=>{if(!filtered.length){setSelectedId(null);return;}if(!selectedId||!filtered.some(d=>d.id===selectedId))setSelectedId(filtered[0].id);},[filtered,selectedId]);\n'
          addition = anchor + '  useEffect(()=>{const target=sessionStorage.getItem("myvor:open-dossier");if(!target)return;const dossier=items.find(item=>item.id===target);if(!dossier)return;sessionStorage.removeItem("myvor:open-dossier");setQuery("");setSelectedId(dossier.id);setGenerationMessage("");if(sessionStorage.getItem("myvor:focus-action"))setTimeout(()=>open(dossier),0);},[items,open]);\n'
          if anchor not in text:
              raise SystemExit('Dossiers selection effect not found')
          text = text.replace(anchor, addition, 1)
          dossiers_path.write_text(text)

          veille_path = Path('myvor-v1/app/VeilleCorporate.tsx')
          text = veille_path.read_text()
          old_sig = 'export default function VeilleCorporate({items,dossiers,add,refresh,refreshing,refreshMessage,link,onOpenImpact,onOpenRadar,onOpenBuilder}:{items:Watch[];dossiers:Dossier[];add:()=>void;refresh:()=>void;refreshing:boolean;refreshMessage:string;link:(watchId:string,dossierId:string|null)=>Promise<void>|void;onOpenImpact?:(dossierId:string,watchIds:string[])=>void;onOpenRadar?:(dossierId:string,watchIds:string[])=>void;onOpenBuilder?:(dossierId:string,watchIds:string[])=>void}){'
          new_sig = 'export default function VeilleCorporate({items,dossiers,add,refresh,refreshing,refreshMessage,link,onOpenDossier,onOpenImpact,onOpenRadar,onOpenBuilder}:{items:Watch[];dossiers:Dossier[];add:()=>void;refresh:()=>void;refreshing:boolean;refreshMessage:string;link:(watchId:string,dossierId:string|null)=>Promise<void>|void;onOpenDossier?:(dossierId:string)=>void;onOpenImpact?:(dossierId:string,watchIds:string[])=>void;onOpenRadar?:(dossierId:string,watchIds:string[])=>void;onOpenBuilder?:(dossierId:string,watchIds:string[])=>void}){'
          if old_sig not in text:
              raise SystemExit('Veille signature not found')
          text = text.replace(old_sig,new_sig,1)
          old_actions = '  function moduleActions(item:Watch){if(!item.dossier_id)return null;return <><button type="button" className="myvor-watch-link" onClick={()=>onOpenImpact?.(item.dossier_id!,[item.id])}><AlertTriangle size={14}/>Score d’urgence</button><button type="button" className="myvor-watch-link" onClick={()=>onOpenRadar?.(item.dossier_id!,[item.id])}><Radar size={14}/>Radar</button><button type="button" className="myvor-watch-link" onClick={()=>onOpenBuilder?.(item.dossier_id!,[item.id])}><Sparkles size={14}/>Note Builder</button></>;}'
          new_actions = '  function moduleActions(item:Watch){if(!item.dossier_id)return null;return <><button type="button" className="myvor-watch-link" onClick={()=>onOpenDossier?.(item.dossier_id!)}><Building2 size={14}/>Ouvrir le dossier</button><button type="button" className="myvor-watch-link" onClick={()=>onOpenImpact?.(item.dossier_id!,[item.id])}><AlertTriangle size={14}/>Score d’urgence</button><button type="button" className="myvor-watch-link" onClick={()=>onOpenRadar?.(item.dossier_id!,[item.id])}><Radar size={14}/>Radar</button><button type="button" className="myvor-watch-link" onClick={()=>onOpenBuilder?.(item.dossier_id!,[item.id])}><Sparkles size={14}/>Note Builder</button></>;}'
          if old_actions not in text:
              raise SystemExit('Veille moduleActions not found')
          text = text.replace(old_actions,new_actions,1)
          veille_path.write_text(text)

          page_path = Path('myvor-v1/app/page.tsx')
          text = page_path.read_text()
          old_route = 'tab==="veille"?<VeilleCorporate items={watch} dossiers={dossiers} add={()=>setModal("watch")} refresh={refreshWatchData} refreshing={syncing} refreshMessage={syncMessage} link={linkWatchToDossier} onOpenImpact={(dossierId,watchIds)=>launchModule("impact",dossierId,watchIds)} onOpenRadar={(dossierId,watchIds)=>launchModule("radar",dossierId,watchIds)} onOpenBuilder={(dossierId,watchIds)=>launchModule("builder",dossierId,watchIds)}/>'
          new_route = 'tab==="veille"?<VeilleCorporate items={watch} dossiers={dossiers} add={()=>setModal("watch")} refresh={refreshWatchData} refreshing={syncing} refreshMessage={syncMessage} link={linkWatchToDossier} onOpenDossier={(dossierId)=>{const dossier=dossiers.find(item=>item.id===dossierId);if(dossier){setTab("dossiers");setSelectedDossier(dossier);}}} onOpenImpact={(dossierId,watchIds)=>launchModule("impact",dossierId,watchIds)} onOpenRadar={(dossierId,watchIds)=>launchModule("radar",dossierId,watchIds)} onOpenBuilder={(dossierId,watchIds)=>launchModule("builder",dossierId,watchIds)}/>'
          if old_route not in text:
              raise SystemExit('Veille page route not found')
          text = text.replace(old_route,new_route,1)
          page_path.write_text(text)
          PY
      - name: Install dependencies
        working-directory: myvor-v1
        run: npm ci
      - name: Build
        working-directory: myvor-v1
        run: npm run build
      - name: Commit connectivity fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add myvor-v1/app/DossiersCorporate.tsx myvor-v1/app/VeilleCorporate.tsx myvor-v1/app/page.tsx
          git commit -m 'Repair dashboard dossier veille connectivity'
          git push
