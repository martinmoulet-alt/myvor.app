name: Apply m2m frontend patch
on:
  push:
    branches:
      - fix/m2m-dossier-veille
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m2m-dossier-veille
      - name: Verify compact migration
        run: |
          echo "479cd3d823c200e2d1e26f79b389a611b361a816c888e5791879a664057d8e28  .m2m_apply.py" | sha256sum -c -
          echo "ac8024e427c55ab3312c3923a17a22f978ab31aa67509c9541ce15905b2d58e0  .m2m.b64.00" | sha256sum -c -
          echo "ab6cc6bc495e16194f78e0e4cdfb3b40815f2400a204c7c1b7a674d8f5026d32  .m2m.b64.01" | sha256sum -c -
          echo "e3eb40aef33b93a25097679b3be4e168cce9835a51c16e6bc185ea72250ae678  .m2m.b64.02" | sha256sum -c -
          echo "4d5ce3df059fcef4e1bdc414f504cb4c2239cb68885acfbef8efe26f2a350426  .m2m.b64.03" | sha256sum -c -
          echo "b4a36cbb84b87ce80a9dd45a5191c7b1c795695077b0abbe8d4db27db2b2e481  .m2m.b64.04" | sha256sum -c -
      - name: Apply verified migration
        run: |
          python .m2m_apply.py
          sed -i 's/[[:space:]]\+$//' myvor-v1/app/ImpactWatchSelector.tsx
          git diff --check
      - name: Remove temporary migration files
        run: |
          git rm -f .m2m_apply.py .m2m.data.00 .m2m.data.01 .m2m.data.02 .m2m.b64.00 .m2m.b64.01 .m2m.b64.02 .m2m.b64.03 .m2m.b64.04 .m2m.patch.gz.b64 .m2m.part.00 .m2m.part.01 .m2m.part.02 .m2m.part.03 .github/workflows/source-snapshot-m2m.yml .github/workflows/apply-m2m-patch.yml
      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myvor-v1
          git commit -m "fix: use m2m dossier watch membership across app"
          git push origin HEAD:fix/m2m-dossier-veille
