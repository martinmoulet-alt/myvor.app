name: Apply m2m frontend patch
on:
  push:
    branches:
      - fix/m2m-dossier-veille
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m2m-dossier-veille
      - name: Apply patch
        run: |
          test -f .m2m.patch.gz.b64
          base64 -d .m2m.patch.gz.b64 | gunzip > /tmp/m2m.patch
          patch -p1 < /tmp/m2m.patch
          git rm .m2m.patch.gz.b64 .github/workflows/source-snapshot-m2m.yml .github/workflows/apply-m2m-patch.yml
      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myvor-v1
          git commit -m "fix: use m2m dossier watch membership across app"
          git push origin HEAD:fix/m2m-dossier-veille
