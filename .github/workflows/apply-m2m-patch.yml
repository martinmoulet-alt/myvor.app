name: Apply m2m frontend patch
on:
  push:
    branches:
      - fix/m2m-dossier-veille
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m2m-dossier-veille
      - name: Verify compact migration
        run: |
          echo "10367bfd2508ce65a7a980bd05fed8a3467cd67db78508a73ff5e3db42296922  .m2m_apply.py" | sha256sum -c -
          echo "766edd671d3b0c8a12d61b49bf8ee199e7d7a8415975e30e232672d46d22a730  .m2m.data.00" | sha256sum -c -
          echo "c6d3b591651a33eecac4a75a904e909c721e19bc977662d8f809ac484042ebf6  .m2m.data.01" | sha256sum -c -
          echo "d895e536b464ca8cd7d4876bfcc7b4f88158367bd3f34970a9161e9181b908a3  .m2m.data.02" | sha256sum -c -
      - name: Apply verified migration
        run: |
          python .m2m_apply.py
          git diff --check
      - name: Remove temporary migration files
        run: |
          git rm -f .m2m_apply.py .m2m.data.00 .m2m.data.01 .m2m.data.02 .m2m.patch.gz.b64 .m2m.part.00 .m2m.part.01 .m2m.part.02 .m2m.part.03 .github/workflows/source-snapshot-m2m.yml .github/workflows/apply-m2m-patch.yml
      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myvor-v1
          git commit -m "fix: use m2m dossier watch membership across app"
          git push origin HEAD:fix/m2m-dossier-veille
