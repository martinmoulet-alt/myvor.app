name: Generate npm lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-lockfile.yml"

permissions:
  contents: write

jobs:
  lock-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: myvor-v1/package.json

      - name: Generate package-lock
        working-directory: myvor-v1
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install from lockfile
        working-directory: myvor-v1
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Myvor
        working-directory: myvor-v1
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mxextphrsggoatcboiqy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Commit package-lock if build passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myvor-v1/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "Lock npm dependencies after successful build"
          git push
