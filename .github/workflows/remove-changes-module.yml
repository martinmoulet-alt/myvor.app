name: Remove standalone changes module

on:
  push:
    paths:
      - '.github/workflows/remove-changes-module.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove standalone changes navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('myvor-v1/app/page.tsx')
          text = path.read_text()
          replacements = [
              ('import {AlertTriangle,ArrowRightLeft,BarChart3,Bell,BriefcaseBusiness,LogOut,Radar,Search,Sparkles,Users,X} from "lucide-react";', 'import {AlertTriangle,BarChart3,Bell,BriefcaseBusiness,LogOut,Radar,Search,Sparkles,Users,X} from "lucide-react";'),
              ('const ChangesModule=dynamic(()=>import("./ChangesModule"),{ssr:false,loading:()=> <div className="muted" style={{padding:24}}>Chargement du module…</div>});\n', ''),
              ('type Tab="dashboard"|"dossiers"|"veille"|"changes"|"alerts"|"impact"|"radar"|"builder"|"team";', 'type Tab="dashboard"|"dossiers"|"veille"|"alerts"|"impact"|"radar"|"builder"|"team";'),
              ('const nav=[["dashboard","Tableau de bord",BarChart3],["dossiers","Dossiers clients",BriefcaseBusiness],["veille","Veille",Search],["changes","Ce qui change",ArrowRightLeft],["impact","Score d’urgence",AlertTriangle],["radar","Radar & War Zone",Radar],["builder","Note Builder",Sparkles],["team","Équipe & accès",Users],["alerts","Alertes",Bell]] as const;', 'const nav=[["dashboard","Tableau de bord",BarChart3],["dossiers","Dossiers clients",BriefcaseBusiness],["veille","Veille",Search],["impact","Score d’urgence",AlertTriangle],["radar","Radar & War Zone",Radar],["builder","Note Builder",Sparkles],["team","Équipe & accès",Users],["alerts","Alertes",Bell]] as const;'),
              (':tab==="changes"?<ChangesModule dossiers={moduleDossiers} watch={moduleWatch} onOpenImpact={(dossierId,watchIds)=>launchModule("impact",dossierId,watchIds)}/>', '')
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected pattern not found: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add myvor-v1/app/page.tsx
          git commit -m 'Remove standalone Ce qui change module'
          git push
