name: Fix Builder Parse

on:
  push:
    paths:
      - .github/workflows/fix-builder-parse.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix JSX numbering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('myvor-v1/app/BuilderModule.tsx')
          s=p.read_text()
          old='<b style={{color:"#b88719"}}>0{index+1}</b>'
          new='<b style={{color:"#b88719"}}>{String(index+1).padStart(2,"0")}</b>'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myvor-v1/app/BuilderModule.tsx
          git commit -m "Fix Note Builder preview numbering"
          git push
