name: Myvor CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: myvor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: myvor-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: myvor-v1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint, unit tests and Next build
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Desktop browser smoke
        run: npm run test:e2e -- --project=desktop-chromium

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: iPhone browser smoke
        run: npm run test:e2e -- --project=iphone

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: myvor-v1/playwright-report
          if-no-files-found: ignore
