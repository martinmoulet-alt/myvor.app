name: Source snapshot m2m
on:
  push:
    branches:
      - fix/m2m-dossier-veille
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: zip -r myvor-source.zip myvor-v1 -x 'myvor-v1/node_modules/*' 'myvor-v1/.next/*'
      - uses: actions/upload-artifact@v4
        with:
          name: myvor-source
          path: myvor-source.zip
          if-no-files-found: error
