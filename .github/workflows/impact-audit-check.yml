name: Impact audit checks
on:
  pull_request:
    paths:
      - 'myvor-v1/**'
      - '.github/workflows/impact-audit-check.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myvor-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: myvor-v1/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build
