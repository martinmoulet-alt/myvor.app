name: Temporary production dependency audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myvor-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: myvor-v1/package-lock.json
      - run: npm ci
      - name: Production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > production-audit.json || true
          cat production-audit.json
