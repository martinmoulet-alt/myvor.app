name: Repair lockfile

on:
  push:
    branches: [hardening-pin-deps]

permissions:
  contents: write

concurrency:
  group: myvor-lockfile-pin-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myvor-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hardening-pin-deps
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: myvor-v1/package-lock.json

      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Synchroniser le lockfile avec les versions figées"
          git push origin HEAD:hardening-pin-deps
