name: Finalize impact PDF patch

on:
  push:
    branches:
      - agent/impact-finalization

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/impact-finalization
          fetch-depth: 0
      - name: Finalize PDF pagination and cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          pdf=Path('myvor-v1/lib/impactPdf.ts')
          text=pdf.read_text()
          old_paragraph='  paragraph(value:unknown,size=10,color:Color=TEXT,bold=false,indent=0,after=7){const lines=wrapText(value,size,CONTENT_W-indent);const lh=size*1.38;this.ensure(lines.length*lh+after);for(const line of lines){this.textAt(line,MARGIN+indent,this.y,size,bold,color);this.y-=lh;}this.y-=after;}'
          new_paragraph='  paragraph(value:unknown,size=10,color:Color=TEXT,bold=false,indent=0,after=7){const lines=wrapText(value,size,CONTENT_W-indent);const lh=size*1.38;for(const line of lines){this.ensure(lh+after);this.textAt(line,MARGIN+indent,this.y,size,bold,color);this.y-=lh;}this.y-=after;}'
          if old_paragraph in text:text=text.replace(old_paragraph,new_paragraph,1)
          elif new_paragraph not in text:raise SystemExit('paragraph anchor missing')

          old_bullet='  bullet(value:string,color:Color=TEXT){const lines=wrapText(value,9.5,CONTENT_W-18);const lh=13;this.ensure(lines.length*lh+5);this.textAt("•",MARGIN+2,this.y,11,true,BLUE);for(let i=0;i<lines.length;i++){this.textAt(lines[i],MARGIN+17,this.y-i*lh,9.5,false,color);}this.y-=lines.length*lh+5;}'
          new_bullet='  bullet(value:string,color:Color=TEXT){const lines=wrapText(value,9.5,CONTENT_W-18);const lh=13;for(let i=0;i<lines.length;i++){this.ensure(lh+5);if(i===0)this.textAt("•",MARGIN+2,this.y,11,true,BLUE);this.textAt(lines[i],MARGIN+17,this.y,9.5,false,color);this.y-=lh;}this.y-=5;}'
          if old_bullet in text:text=text.replace(old_bullet,new_bullet,1)
          elif new_bullet not in text:raise SystemExit('bullet anchor missing')

          old_blob='  const bytes=buildImpactPdf(note,dossier,mode);const blob=new Blob([bytes],{type:"application/pdf"});'
          new_blob='  const bytes=buildImpactPdf(note,dossier,mode);const buffer=bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength) as ArrayBuffer;const blob=new Blob([buffer],{type:"application/pdf"});'
          if old_blob in text:text=text.replace(old_blob,new_blob,1)
          elif new_blob not in text:raise SystemExit('blob anchor missing')
          pdf.write_text(text)

          module=Path('myvor-v1/app/ImpactModule.tsx')
          source=module.read_text()
          legacy='function escapeHtml(value:unknown){return String(value??"").replace(/[&<>\'\"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\'":"&#39;",\'"\':"&quot;"}[char]||char));}\nfunction listHtml(items?:string[]){if(!items?.length)return"<p class=\'muted\'>Aucun élément identifié.</p>";return`<ul>${items.map(item=>`<li>${escapeHtml(item)}</li>`).join("")}</ul>`;}\nfunction evidenceHtml(evidence?:Evidence|null){if(!evidence)return"<div class=\'proof missing\'><b>Preuve précise non retrouvée</b><span>À vérifier manuellement dans les sources lues.</span></div>";const label=evidence.kind==="official"?"Preuve institutionnelle":"Mémoire stratégique du dossier";return`<div class=\'proof\'><b>${escapeHtml(label)} — ${escapeHtml(evidence.source_title)}</b><q>${escapeHtml(evidence.excerpt)}</q>${evidence.source_url?`<small>${escapeHtml(evidence.source_url)}</small>`:""}</div>`;}\n'
          if legacy in source:source=source.replace(legacy,'',1)
          module.write_text(source)

          Path('.github/workflows/impact-finalization-patch.yml').unlink()
          PY
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A myvor-v1/lib/impactPdf.ts myvor-v1/app/ImpactModule.tsx .github/workflows/impact-finalization-patch.yml
          git commit -m "Finalize impact PDF pagination [skip ci]"
          git push origin HEAD:agent/impact-finalization
