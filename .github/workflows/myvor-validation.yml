name: Myvor validation

on:
  push:
    branches: [main]
    paths:
      - 'myvor-v1/**'
      - '.github/workflows/myvor-validation.yml'
  pull_request:
    paths:
      - 'myvor-v1/**'
      - '.github/workflows/myvor-validation.yml'

permissions:
  contents: read

concurrency:
  group: myvor-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myvor-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: myvor-v1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and audit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myvor-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: myvor-v1/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
