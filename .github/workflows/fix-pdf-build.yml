name: Validate and repair PDF build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: myvor-v1/package-lock.json

      - name: Synchronize lockfile
        working-directory: myvor-v1
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install
        working-directory: myvor-v1
        run: npm ci

      - name: Production build
        working-directory: myvor-v1
        run: npm run build

      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myvor-v1/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
          else
            git commit -m "Sync PDF dependency lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
