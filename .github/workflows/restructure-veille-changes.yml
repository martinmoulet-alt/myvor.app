name: Restructure veille changes

on:
  push:
    paths:
      - '.github/workflows/restructure-veille-changes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: myvor-v1/package-lock.json
      - name: Restructure Ce qui change cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('myvor-v1/app/VeilleCorporate.tsx')
          text = path.read_text()
          old = '''  function renderChange(item:Watch){const baselines=baselineItems(item);const dossier=dossiers.find(d=>d.id===item.dossier_id);return <article id={`watch-${item.id}`} className={`myvor-watch-change-card ${focusId===item.id?"myvor-watch-focus":""}`} key={item.id}><div className="myvor-watch-work-top"><div><span className="myvor-watch-kind">{item.change_type||item.nature}</span>{dossier&&<span className="myvor-watch-dossier-pill">{dossier.client}</span>}</div><time>{publicationDate(item)}</time></div><h3>{item.title}</h3><div className="myvor-watch-change-flow"><div><small>Référence antérieure</small><b>{baselines.length?baselines.map(value=>value.title).join(" · "):"Aucun texte antérieur identifié dans le corpus"}</b></div><ArrowRight size={18}/><div><small>Nouveau texte</small><b>{item.title}</b></div></div><div className="myvor-watch-change-summary"><small>Ce qui change</small><p>{item.change_summary||item.link_justification?.consequence||"Myvor a identifié une évolution normative, mais la synthèse détaillée n’est pas encore disponible."}</p></div><div className="myvor-watch-actions">{sourceLink(item,"Voir le texte")}{moduleActions(item)}<button type="button" className="myvor-watch-link" onClick={()=>toggleDetail(item)}><Eye size={14}/>{selectedId===item.id?"Fermer":"Détails"}</button></div>{detailPanel(item)}</article>;}'''
          new = '''  function renderChange(item:Watch){const baselines=baselineItems(item);const dossier=dossiers.find(d=>d.id===item.dossier_id);const operational=item.link_justification?.consequence||"Conséquence opérationnelle à consolider pour ce dossier.";return <article id={`watch-${item.id}`} className={`myvor-watch-change-card ${focusId===item.id?"myvor-watch-focus":""}`} key={item.id}><div className="myvor-watch-work-top"><div><span className="myvor-watch-kind">{item.change_type||item.nature}</span>{dossier&&<span className="myvor-watch-dossier-pill">{dossier.client}</span>}</div><time>{publicationDate(item)}</time></div><h3>{item.title}</h3><div className="myvor-watch-change-modules"><section className="myvor-watch-change-module before"><div className="myvor-watch-change-module-label"><span>1</span><b>Avant</b></div><p>{baselines.length?baselines.map(value=>value.title).join(" · "):"Aucun état antérieur suffisamment consolidé dans le corpus Myvor."}</p></section><section className="myvor-watch-change-module now"><div className="myvor-watch-change-module-label"><span>2</span><b>Maintenant</b></div><p>{item.change_summary||`Le nouveau texte applicable est : ${item.title}.`}</p></section><section className="myvor-watch-change-module operational"><div className="myvor-watch-change-module-label"><span>3</span><b>Conséquences opérationnelles</b></div><p>{operational}</p></section></div><div className="myvor-watch-actions">{sourceLink(item,"Voir le texte")}{moduleActions(item)}<button type="button" className="myvor-watch-link" onClick={()=>toggleDetail(item)}><Eye size={14}/>{selectedId===item.id?"Fermer":"Détails"}</button></div>{detailPanel(item)}</article>;}'''
          if old not in text:
              raise SystemExit('renderChange pattern not found')
          text = text.replace(old,new,1)
          old_css = '.myvor-watch-change-flow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}.myvor-watch-change-flow>div{border:1px solid #183853;background:#071c33;border-radius:10px;padding:11px;min-height:72px}.myvor-watch-change-flow>svg{color:#f3bd3e}.myvor-watch-change-flow b{display:block;color:#eaf1f8;font-size:10px;line-height:1.4;margin-top:4px}.myvor-watch-change-summary{border-left:3px solid #f3bd3e;background:#0a2038;border-radius:0 10px 10px 0;padding:11px 12px}.myvor-watch-change-summary p{margin:4px 0 0;color:#c5d3e1;font-size:11px;line-height:1.5}'
          new_css = '.myvor-watch-change-modules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.myvor-watch-change-module{border:1px solid #183853;background:#071c33;border-radius:11px;padding:13px;display:grid;align-content:start;gap:9px;min-height:138px}.myvor-watch-change-module.before{border-top:3px solid #71869e}.myvor-watch-change-module.now{border-top:3px solid #3199ff}.myvor-watch-change-module.operational{border-top:3px solid #f3bd3e}.myvor-watch-change-module-label{display:flex;align-items:center;gap:8px}.myvor-watch-change-module-label>span{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#0a2947;border:1px solid #244d70;color:#9fc8f2;font-size:8px;font-weight:950}.myvor-watch-change-module.operational .myvor-watch-change-module-label>span{background:#f3bd3e;border-color:#f3bd3e;color:#07162c}.myvor-watch-change-module-label b{text-transform:uppercase;letter-spacing:.07em;color:#eef4fb;font-size:9px}.myvor-watch-change-module p{margin:0;color:#b7c6d5;font-size:10.5px;line-height:1.55}.myvor-watch-change-module.operational p{color:#e0e8f0;font-weight:700}'
          if old_css not in text:
              raise SystemExit('change CSS pattern not found')
          text = text.replace(old_css,new_css,1)
          old_mobile = '@media(max-width:850px){.myvor-watch-detail-grid{grid-template-columns:1fr}.myvor-watch-tabs'
          new_mobile = '@media(max-width:850px){.myvor-watch-change-modules{grid-template-columns:1fr}.myvor-watch-change-module{min-height:0}.myvor-watch-detail-grid{grid-template-columns:1fr}.myvor-watch-tabs'
          if old_mobile not in text:
              raise SystemExit('mobile CSS pattern not found')
          text = text.replace(old_mobile,new_mobile,1)
          old_desc = '<h2>Ce qui change</h2><p>La modification utile : texte antérieur, nouveau texte et conséquence identifiée par Myvor.</p>'
          new_desc = '<h2>Ce qui change</h2><p>Pour chaque évolution : l’état antérieur, la règle actuelle et ses conséquences opérationnelles pour le dossier.</p>'
          if old_desc in text:
              text = text.replace(old_desc,new_desc,1)
          path.write_text(text)
          PY
      - name: Install dependencies
        working-directory: myvor-v1
        run: npm ci
      - name: Build
        working-directory: myvor-v1
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add myvor-v1/app/VeilleCorporate.tsx
          git commit -m 'Structure Ce qui change in three operational modules'
          git push
